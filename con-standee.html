<style>
  @page { size: A5 portrait; margin: 0; }

  html, body { margin: 0; padding: 0; background: #0f0a22; }
  .sheet {
    width: 148mm; height: 210mm; padding: 9mm 9mm 8mm;
    display: flex; flex-direction: column; justify-content: space-between;
    color: #f7f4ff; font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    background:
      radial-gradient(80% 55% at 50% 8%, #3b2669 0%, rgba(59,38,105,0) 62%),
      linear-gradient(165deg, #140d2b 0%, #1c1238 55%, #2a1a4d 100%);
  }
  .brand { display: flex; align-items: center; gap: 3.2mm; }
  .brand-logo { width: 17mm; height: 17mm; border-radius: 3mm; display: block; box-shadow: 0 2mm 6mm rgba(0,0,0,.5); }
  .brand-name { font-size: 10.5pt; font-weight: 700; letter-spacing: .14em; line-height: 1.2; }
  .brand-name small { display: block; font-size: 6.2pt; letter-spacing: .2em; color: #b6a9dc; font-weight: 600; margin-top: .8mm; }
  .eyebrow { margin-top: 6mm; font-size: 8pt; letter-spacing: .26em; text-transform: uppercase; color: #f0c46a; }
  h1 { margin: 2mm 0 1.5mm; font-size: 26pt; line-height: 1.02; letter-spacing: -.02em; }
  h1 b { color: #f6d798; }
  .lede { margin: 0; font-size: 10pt; color: #d6cdf0; line-height: 1.4; max-width: 96mm; }
  .qrwrap { display: flex; justify-content: center; margin: 4mm 0 2mm; }
  .qrbox { background: #fff; padding: 4.2mm; border-radius: 4mm; box-shadow: 0 0 0 1.2mm rgba(240,196,106,.55), 0 6mm 14mm rgba(0,0,0,.45); }
  .qrbox img { display: block; width: 76mm; height: 76mm; }
  .scanline { text-align: center; font-size: 9pt; color: #cfc6e6; margin-top: 2.5mm; }
  .scanline b { color: #fff; }
  .steps { display: flex; gap: 2mm; margin-top: 1mm; }
  .step { flex: 1; background: rgba(255,255,255,.055); border: .3mm solid rgba(255,255,255,.12); border-radius: 2.5mm; padding: 2.4mm 1.6mm; text-align: center; }
  .step i { display: block; font-style: normal; font-size: 7pt; letter-spacing: .12em; color: #f0c46a; font-weight: 700; margin-bottom: .8mm; }
  .step span { display: block; font-size: 7.4pt; color: #e6dfff; line-height: 1.2; }
  .foot { display: flex; align-items: center; justify-content: space-between; margin-top: 3mm; font-size: 7pt; color: #a99ecb; letter-spacing: .04em; }
  .foot b { color: #f0c46a; letter-spacing: .12em; }
</style>
